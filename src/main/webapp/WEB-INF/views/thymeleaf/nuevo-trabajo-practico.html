<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo Trabajo Práctico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>

<body>

<!--<div th:replace="~{componentes/sidebar :: sidebar-nav}"></div> -->

<div class="contenido-principal">
    <!--<div th:replace="~{componentes/header :: header-principal}"></div>-->
    <main class="container">

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="mb-4">Registrar Nuevo Trabajo Práctico</h2>

                        <form th:action="@{/guardar-trabajo-practico}" th:object="${trabajoPractico}" method="POST">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Trabajo Práctico</label>
                                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="materia" class="form-label">Materia</label>
                                <input type="text" id="materia" th:field="*{materia}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="tipo" class="form-label">Tipo (Ej: Grupal, Individual)</label>
                                <input type="text" id="tipo" th:field="*{tipo}" class="form-control">
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/trabajos-practicos}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar Trabajo Práctico</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

</body>
</html>
