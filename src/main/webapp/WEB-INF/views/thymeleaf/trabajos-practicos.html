<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trabajos Prácticos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>

<body>

<!--<div th:replace="~{componentes/sidebar :: sidebar-nav}"></div> -->

<div class="contenido-principal">
    <!--<div th:replace="~{componentes/header :: header-principal}"></div>-->
    <main class="container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1>Trabajos Prácticos</h1>
                <p class="text-muted">Administrá tus entregas y planificación de TPs.</p>
            </div>
            <a th:href="@{/nuevo-trabajo-practico}" class="btn btn-primary">+ Agregar trabajo práctico</a>
        </div>

        <!-- BUSCADOR -->
        <form th:action="@{/trabajos-practicos}" method="GET" class="mb-4">
            <div class="input-group">
                <input type="text" name="materia" class="form-control" placeholder="Buscar por materia..." th:value="${materiaBuscada}">
                <button type="submit" class="btn btn-outline-primary">Buscar</button>
                <a th:href="@{/trabajos-practicos}" class="btn btn-outline-secondary">Mostrar todos</a>
            </div>
        </form>

        <!-- LISTADO GENERAL -->
        <div>
            <div th:if="${trabajosPracticos != null and trabajosPracticos.isEmpty()}" class="alert alert-info">
                Todavía no tenés trabajos prácticos cargados.
            </div>

            <div th:each="tp : ${trabajosPracticos}" class="card mb-3">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <div class="materia-color bg-secondary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                                <span th:text="${tp.nombre != null and !tp.nombre.isEmpty() ? #strings.substring(tp.nombre,0,1) : 'T'}">T</span>                            </div>
                        </div>
                        <!-- Datos -->
                        <div class="col">
                            <h3 th:text="${tp.nombre}">Nombre TP</h3>
                            <p class="mb-1"><strong>Materia:</strong> <span th:text="${tp.materia}">Materia</span></p>
                            <p class="mb-1"><strong>Tipo:</strong> <span th:text="${tp.tipo}">Tipo</span></p>
                            <p class="mb-1"><strong>Estado:</strong> <span th:text="${tp.estado}">Estado</span></p>
                        </div>
                        <!-- Acciones -->
                        <div class="col-auto">
                            <a th:href="@{/trabajos-practicos/editar(id=${tp.id})}" class="btn btn-outline-secondary mb-2 btn-sm">
                                Editar
                            </a>
                            <form th:action="@{/trabajos-practicos/eliminar}" method="POST">
                                <input type="hidden" name="id" th:value="${tp.id}">
                                <button type="submit" class="btn btn-outline-danger btn-sm">Eliminar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

</body>
</html>
